# Ruff configuration; run with: python -m ruff check .
# (install the tooling with: pip install -r requirements-dev.txt)

line-length = 100

[lint]
# The stable pycodestyle subset (E4/E5/E7/E9 — imports, blank lines,
# statement style, runtime errors) plus all of pyflakes. The E1xx–E3xx
# whitespace/indentation rules are preview-gated in ruff 0.17, so they are
# not active without `preview = true`. The tools/ scripts deliberately
# import from a sys.path-inserted directory, so those imports come after
# module-level code and are guarded with `noqa: E402`.
select = ["E", "F"]
